<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme:light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tree Studio">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<title>改善スタジオ ｜ TAKUHA tree</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .topbar{position:sticky;top:0;z-index:30;overflow:hidden;color:#fff;
    background:linear-gradient(140deg,var(--brand-deep) 0%,var(--brand) 62%,var(--brand-ink) 130%);
    padding:calc(var(--safe-t) + 14px) 16px 14px;
    border-bottom-left-radius:var(--r-xl);border-bottom-right-radius:var(--r-xl);
    box-shadow:var(--shadow-m)}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .back{width:38px;height:38px;border-radius:var(--r-full);background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.24);color:#fff;font-size:18px;text-decoration:none;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:.2px}
  .topbar .sub{font-size:10.5px;opacity:.9;margin-top:2px}

  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:var(--r-md);
    margin:14px 14px 0}
  .tabs button{flex:1;height:42px;border-radius:var(--r-sm);color:var(--mut);
    font-size:12.5px;font-weight:800;transition:.15s var(--ease)}
  .tabs button.on{background:var(--brand);color:var(--brand-on);box-shadow:var(--shadow-s)}

  .pane{display:none;padding:14px}
  .pane.on{display:block;animation:fade .24s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow-s)}
  .card h2{font-size:13px;color:var(--brand-ink);font-weight:800;display:flex;align-items:center;gap:7px;
    border-left:3px solid var(--brand);padding-left:9px;margin-bottom:12px}
  .card h2 .badge{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--mut)}

  .seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:var(--r-md);margin-bottom:12px}
  .seg button{flex:1;height:38px;border-radius:var(--r-sm);color:var(--mut);font-size:12px;font-weight:800}
  .seg button.on{background:var(--brand);color:var(--brand-on);box-shadow:var(--shadow-s)}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .kpi{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
    padding:11px 9px;text-align:center}
  .kpi .v{font-size:22px;font-weight:800;color:var(--brand-ink);font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .l{font-size:9.5px;color:var(--mut);font-weight:700;margin-top:3px;line-height:1.4}

  .barrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .barrow .nm{flex:0 0 96px;font-size:11px;font-weight:800;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .barrow .tr{flex:1;height:16px;border-radius:var(--r-full);background:var(--surface-3);
    overflow:hidden;position:relative;min-width:0}
  .barrow .pl{position:absolute;inset:0;border-radius:var(--r-full);opacity:.28}
  .barrow .dn{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full)}
  .barrow .pc{flex:0 0 46px;text-align:right;font-size:11px;font-weight:800;
    font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .barrow.low .pc{color:var(--jp)}

  .spark{display:flex;align-items:flex-end;gap:3px;height:74px;margin-top:4px}
  .spark .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .spark .bar{width:100%;border-radius:3px 3px 0 0;background:var(--brand);min-height:2px}
  .spark .bar.zero{background:var(--surface-3)}
  .sparklab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut);
    font-weight:700;margin-top:5px}

  .wdgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .wdgrid .c{background:var(--surface-2);border:1px solid var(--line-soft);
    border-radius:var(--r-sm);padding:8px 2px}
  .wdgrid .c .d{font-size:10px;color:var(--mut);font-weight:800}
  .wdgrid .c .p{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .wdgrid .c.low .p{color:var(--jp)}
  .wdgrid .c.hi .p{color:var(--brand-ink)}

  .sug{display:flex;gap:11px;padding:12px;border-radius:var(--r-md);background:var(--surface-2);
    border:1px solid var(--line-soft);margin-bottom:9px;border-left:3px solid var(--mut)}
  .sug.warn{border-left-color:var(--jp)}
  .sug.good{border-left-color:var(--brand)}
  .sug.info{border-left-color:var(--warn-line)}
  .sug .si{font-size:19px;line-height:1.2;flex:0 0 auto}
  .sug .st{display:block;font-size:13px;font-weight:800;margin-bottom:3px}
  .sug .sb{display:block;font-size:12px;color:var(--ink-2);line-height:1.65}

  .empty{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 10px;line-height:1.9}

  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .sw{border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 8px;
    background:var(--surface-2);text-align:center;transition:.14s var(--ease)}
  .sw.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
  .sw .dots{display:flex;justify-content:center;gap:4px;margin-bottom:7px}
  .sw .dot{width:15px;height:15px;border-radius:var(--r-full)}
  .sw .nm{font-size:10.5px;font-weight:800;color:var(--ink-2)}

  .pv{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
  .pv .pvtop{padding:12px 13px;color:#fff;
    background:linear-gradient(140deg,var(--brand-deep) 0%,var(--brand) 62%,var(--brand-ink) 130%)}
  .pv .pvtop b{font-size:13px;font-weight:800}
  .pv .pvtop span{display:block;font-size:9.5px;opacity:.9;margin-top:2px}
  .pv .pvbody{padding:11px 13px;display:flex;gap:8px;align-items:center}
  .pv .pvcell{flex:1;background:var(--surface);border:1px solid var(--brand);
    border-radius:var(--r-sm);padding:7px;font-size:10px;font-weight:800}
  .pv .pvbtn{background:var(--brand);color:var(--brand-on);border-radius:var(--r-sm);
    padding:8px 13px;font-size:11.5px;font-weight:800}
  .pv .pvnav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
  .pv .pvnav span{flex:1;text-align:center;padding:8px 0;font-size:9.5px;font-weight:800;color:var(--mut)}
  .pv .pvnav span.on{color:var(--brand-ink)}

  .field{width:100%;height:46px;border:1px solid var(--line);border-radius:var(--r-md);
    padding:0 11px;background:var(--surface-2);color:var(--ink)}
  textarea.field{height:88px;padding:11px;resize:vertical;line-height:1.65;font-size:15px}
  .fldlab{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:5px;display:block}
  .frmrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .frmrow>*{flex:1;min-width:130px}

  .btn{height:46px;border-radius:var(--r-md);font-size:13px;font-weight:800;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);padding:0 16px}
  .btn.primary{background:var(--brand);color:var(--brand-on);border-color:var(--brand);box-shadow:var(--shadow-s)}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  .btnrow .btn{flex:1;min-width:120px}

  .out{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);
    padding:13px;font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
    -webkit-user-select:text;user-select:text;margin-bottom:10px}
  .outlab{font-size:10px;font-weight:800;color:var(--brand-ink);letter-spacing:.5px;margin-bottom:5px}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
    bottom:calc(var(--safe-b) + 22px);z-index:80;
    background:var(--surface-3);color:var(--ink);border:1px solid var(--line);
    padding:11px 18px;border-radius:var(--r-full);font-size:12.5px;font-weight:800;
    box-shadow:var(--shadow-m);opacity:0;pointer-events:none;transition:.26s var(--ease);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" style="padding-bottom:calc(var(--safe-b) + 24px)">

  <header class="topbar">
    <div class="row">
      <a class="back" href="../" aria-label="カレンダーに戻る">‹</a>
      <div>
        <h1>🧪 改善スタジオ</h1>
        <div class="sub">TAKUHA tree のデータを読んで、次の一手を出す</div>
      </div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="on" id="t-an" onclick="showPane('an')">📈 分析</button>
    <button id="t-lk" onclick="showPane('lk')">🎨 見た目</button>
    <button id="t-sc" onclick="showPane('sc')">✍️ 台本</button>
  </div>

  <!-- ============ 分析 ============ -->
  <section class="pane on" id="p-an">
    <div class="seg" role="group" aria-label="集計期間">
      <button id="pd-7" onclick="setPeriod(7)">7日</button>
      <button class="on" id="pd-14" onclick="setPeriod(14)">14日</button>
      <button id="pd-30" onclick="setPeriod(30)">30日</button>
    </div>

    <div class="card">
      <h2>📊 ざっくり<span class="badge" id="anRange"></span></h2>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kRate">–</div><div class="l">予定の消化率</div></div>
        <div class="kpi"><div class="v" id="kApo">–</div><div class="l">アポ枠の稼働</div></div>
        <div class="kpi"><div class="v" id="kStreak">–</div><div class="l">発信の連続日数</div></div>
      </div>
      <div class="spark" id="spark"></div>
      <div class="sparklab"><span id="sparkA"></span><span id="sparkB"></span></div>
    </div>

    <div class="card">
      <h2>🎨 種類ごとの消化率<span class="badge">濃い部分＝やれた分</span></h2>
      <div id="catBars"></div>
    </div>

    <div class="card">
      <h2>📅 曜日ごとの消化率</h2>
      <div class="wdgrid" id="wdGrid"></div>
    </div>

    <div class="card">
      <h2>💡 改善案</h2>
      <div id="sugs"></div>
    </div>
  </section>

  <!-- ============ 見た目 ============ -->
  <section class="pane" id="p-lk">
    <div class="card">
      <h2>🌗 明るさ</h2>
      <div class="seg" role="group" aria-label="テーマ">
        <button id="th-auto" onclick="pickTheme('auto')">🌗 自動</button>
        <button id="th-light" onclick="pickTheme('light')">☀️ ライト</button>
        <button id="th-dark" onclick="pickTheme('dark')">🌙 ダーク</button>
      </div>
      <div class="empty" style="padding:2px 0 0;text-align:left">「自動」は端末の設定に合わせます。</div>
    </div>

    <div class="card">
      <h2>🎨 アクセント色</h2>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="card">
      <h2>👀 プレビュー<span class="badge">保存はすぐ反映</span></h2>
      <div class="pv">
        <div class="pvtop"><b>🌳 TAKUHA tree</b><span>🇬🇹⇄🇯🇵 15h ／ 今の色の見え方</span></div>
        <div class="pvbody">
          <div class="pvcell">15<br><span style="color:var(--mut);font-weight:700">🇪🇸授業</span></div>
          <div class="pvcell" style="border-color:var(--line)">16<br><span style="color:var(--mut);font-weight:700">📚自習</span></div>
          <span class="pvbtn">Hoy 今日</span>
        </div>
        <div class="pvnav"><span class="on">📅 月</span><span>📋 日</span><span>📰 Feed</span><span>🔄 Zona</span></div>
      </div>
    </div>
  </section>

  <!-- ============ 台本 ============ -->
  <section class="pane" id="p-sc">
    <div class="card">
      <h2>🗓️ どの日のこと？</h2>
      <div class="frmrow">
        <div><label class="fldlab" for="scDate">日付</label><input class="field" type="date" id="scDate"></div>
        <div><label class="fldlab" for="scArr">グアテマラ入りした日（任意）</label><input class="field" type="date" id="scArr"></div>
      </div>
      <label class="fldlab" for="scMemo">その日あったこと・言いたいこと（任意）</label>
      <textarea class="field" id="scMemo" placeholder="例: 市場で値切れた／先生に発音褒められた／雨で予定が全部ずれた"></textarea>
      <div class="btnrow" style="margin-top:11px">
        <button class="btn primary" onclick="genScript()">✍️ 台本をつくる</button>
        <button class="btn" onclick="genScript(true)">🔀 別の案</button>

    </div>
    <div id="scOut"></div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../app-core.js"></script>
<script>
/* ============================================================
   共通
   ============================================================ */
let toastT=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}
function save(){if(!saveDB())toast('保存できませんでした');}
function showPane(p){
  ['an','lk','sc'].forEach(k=>{
    document.getElementById('p-'+k).classList.toggle('on',k===p);
    document.getElementById('t-'+k).classList.toggle('on',k===p);
  });
  window.scrollTo(0,0);
}

/* ============================================================
   分析
   ============================================================ */
/* いつもの時間割は終了時刻を持たない行があるので、次の行までを長さとみなす。
   最後の行だけは 60 分扱い（就寝行なので中身に影響しない）。 */
function rowsFor(ds){
  const out=[];
  const tl=timeline(dayType(ds));
  tl.forEach((r,i)=>{
    const nx=tl[i+1];
    const dur=r.e?(r.e-r.g):(nx?Math.min(Math.max(nx.g-r.g,0),120):60);
    out.push({dur,cat:r.cat,k:'r'+r.g});
  });
  (DB.events[ds]||[]).forEach(e=>out.push({dur:e.dur||30,cat:e.cat||'free',k:'e'+e.id}));
  const bk=DB.appts[ds]||{};
  Object.keys(bk).forEach(i=>{if(APO[i])out.push({dur:30,cat:'apo',k:'a'+i});});
  return out;
}
let PERIOD=14;
function setPeriod(n){
  PERIOD=n;
  [7,14,30].forEach(k=>document.getElementById('pd-'+k).classList.toggle('on',k===n));
  renderAnalysis();
}
function analyze(nDays){
  const today=todayStr();
  const st={days:nDays,rows:0,done:0,cat:{},wd:Array.from({length:7},()=>({rows:0,done:0})),
    apoBooked:0,apoSlots:0,perDay:[],from:addDays(today,-(nDays-1)),to:today};
  for(let i=nDays-1;i>=0;i--){
    const ds=addDays(today,-i);
    const rows=rowsFor(ds), dn=DB.done[ds]||{};
    let d=0;
    rows.forEach(r=>{
      const ok=!!dn[r.k];
      st.rows++;if(ok){st.done++;d++;}
      const c=st.cat[r.cat]||(st.cat[r.cat]={rows:0,done:0,min:0,doneMin:0});
      c.rows++;c.min+=r.dur;if(ok){c.done++;c.doneMin+=r.dur;}
      const w=st.wd[dow(ds)];w.rows++;if(ok)w.done++;
    });
    st.apoSlots+=APO.length;
    st.apoBooked+=Object.keys(DB.appts[ds]||{}).length;
    st.perDay.push({ds,total:rows.length,done:d});
  }
  return st;
}
/* 発信(sns)の行を1つでも消化した日が、今日から何日続いているか */
function snsStreak(){
  let n=0;
  for(let i=0;i<120;i++){
    const ds=addDays(todayStr(),-i);
    const dn=DB.done[ds]||{};
    const hit=rowsFor(ds).filter(r=>r.cat==='sns').some(r=>dn[r.k]);
    if(hit){n++;continue;}
    if(i===0)continue;   /* 今日はまだ途中。未達でも連続は切らない */
    break;
  }
  return n;
}
const CAT_TIP={
  study:'枠が大きいほど飛びやすい。1回30分に割って、授業の直後のカフェに寄せると乗りやすい。',
  film :'撮影と編集を同じ日に詰めると重い。撮りだめの日と編集の日を分けて、編集は1本ずつ。',
  sns  :'朝の投稿が飛ぶなら、前夜のうちに予約投稿まで済ませてしまう。',
  train:'朝のトレが飛ぶなら、授業のあとの散歩に振り替える。ゼロの日を作らないほうが優先。',
  talk :'相手が決まっていない会話は飛ぶ。前日にアポを1本入れておく。',
  self :'5分の振り返りは寝る直前より、夜リールを出した直後に寄せると続く。',
  meal :'自炊が飛ぶなら週末にまとめて仕込む。vlog のネタも同時に撮れる。',
  free :'フリーが消えているのは他が押している合図。予定を減らす側で調整する。',
  work :'日本時間の仕事は相手都合。20:00の枠を前に倒せないか見直す。',
  ai   :'AI作業は細切れだと進まない。週末に寄せてまとめて。',
  play :'遊びが飛ぶと燃え尽きる。土日のどちらかは予定を空ける。',
  fix  :'授業を落としているなら、削るべきは他のほう。ここは最後に守る。',
  apo  :'アポが流れているなら、確認の連絡を前日に固定する。',
};
function suggest(st){
  const out=[];
  if(st.done===0){
    out.push({tone:'info',i:'👋',t:'まず完了チェックから',
      b:'日ビューの各行の右にある ◯ を押すと「やれた」が記録されます。3日ぶんたまると、ここに偏りと改善案が出ます。'});
    return out;
  }
  const rate=st.done/st.rows;
  if(rate<.4)out.push({tone:'warn',i:'📉',t:`消化率 ${Math.round(rate*100)}% — 予定を立てすぎ`,
    b:'できなかった予定が多いと、計画そのものを見なくなります。1日の行を2〜3本減らして、確実に埋まる形まで落とすほうが結果的に進みます。'});
  else if(rate>.88)out.push({tone:'good',i:'🚀',t:`消化率 ${Math.round(rate*100)}% — 余力あり`,
    b:'ほぼ計画どおり動けています。負荷を1段上げるか、遊び・休みの枠を増やして燃え尽きを避けるか、どちらかを意図的に選ぶタイミング。'});

  /* 消化率の低いカテゴリ。数回しか出ていない種類で決めつけないよう、
     期間の長さに応じた最低サンプル数を要求する（14日なら7回以上）。 */
  const minN=Math.max(4,Math.round(st.days/2));
  const cats=Object.entries(st.cat).filter(([,c])=>c.rows>=minN)
    .map(([k,c])=>({k,r:c.done/c.rows,rows:c.rows,min:c.min}));
  cats.sort((a,b)=>a.r-b.r);
  const worst=cats[0];
  if(worst&&worst.r<.6){const c=catOf(worst.k);
    out.push({tone:'warn',i:c.e,t:`${c.n} が ${Math.round(worst.r*100)}% しか消化できていない`,
      b:(CAT_TIP[worst.k]||'枠の大きさか時間帯を疑う。')+`（${st.days}日で ${worst.rows} 回中 ${st.cat[worst.k].done} 回）`});}
  const best=cats[cats.length-1];
  if(best&&best.r>=.85&&best!==worst){const c=catOf(best.k);
    out.push({tone:'good',i:c.e,t:`${c.n} は安定して回っている`,
      b:'ここは崩さない。他を削るときも、この枠は最後まで残すほうがリズムが保てます。'});}

  /* 発信は続いているのに編集が追いつかない、という詰まり方 */
  const sns=st.cat.sns,film=st.cat.film;
  if(sns&&film&&sns.rows>=3&&film.rows>=3){
    const rs=sns.done/sns.rows, rf=film.done/film.rows;
    if(rs-rf>.25)out.push({tone:'info',i:'🎬',t:'発信は続いているが、編集が追いついていない',
      b:'投稿の消化率が編集を大きく上回っています。在庫が尽きると急に止まるので、週に1日「撮りだめだけの日」を作っておくと切れません。'});
  }

  /* アポ枠 */
  const ar=st.apoSlots?st.apoBooked/st.apoSlots:0;
  if(ar<.2)out.push({tone:'info',i:'🤝',t:`アポ枠の稼働 ${Math.round(ar*100)}%（${st.apoBooked}/${st.apoSlots}）`,
    b:'空き枠が多いので、枠を6→3に減らして「この時間だけ空いてます」と出すほうが埋まりやすい。空けた分は発信か編集に回せます。'});
  else if(ar>.7)out.push({tone:'good',i:'🤝',t:`アポ枠の稼働 ${Math.round(ar*100)}% — ほぼ満席`,
    b:'埋まりきっています。枠を増やすか単価を上げるか、どちらかを検討する時期。'});

  /* 曜日の落ち込み */
  const wds=st.wd.map((w,i)=>({i,r:w.rows?w.done/w.rows:null,rows:w.rows})).filter(w=>w.r!==null&&w.rows>=3);
  if(wds.length>=4){
    const avg=wds.reduce((s,w)=>s+w.r,0)/wds.length;
    const lo=wds.slice().sort((a,b)=>a.r-b.r)[0];
    if(avg-lo.r>.2)out.push({tone:'warn',i:'📅',t:`${WKJ[lo.i]}曜が落ちている（${Math.round(lo.r*100)}%／平均 ${Math.round(avg*100)}%）`,
      b:`${WKJ[lo.i]}曜だけ別の予定が入りがちなのかも。この曜日はいつもの時間割を薄くして、余白を先に確保しておくと崩れません。`});
  }

  if(out.length===1&&out[0].tone==='good')out.push({tone:'info',i:'🪞',t:'次に見るなら',
    b:'期間を30日に伸ばすと、曜日ごとの癖が見えてきます。'});
  return out;
}
function renderAnalysis(){
  const st=analyze(PERIOD);
  document.getElementById('anRange').textContent=`${st.from} 〜 ${st.to}`;
  const rate=st.rows?st.done/st.rows:0;
  document.getElementById('kRate').textContent=st.rows?Math.round(rate*100)+'%':'–';
  document.getElementById('kApo').textContent=st.apoSlots?Math.round(st.apoBooked/st.apoSlots*100)+'%':'–';
  const stk=snsStreak();
  document.getElementById('kStreak').textContent=stk?stk+'日':'0日';

  /* 日ごとの消化率 */
  const sp=document.getElementById('spark');
  sp.innerHTML=st.perDay.map(d=>{
    const p=d.total?Math.round(d.done/d.total*100):0;
    return `<div class="col" title="${d.ds} ${d.done}/${d.total}">
      <div class="bar${p===0?' zero':''}" style="height:${Math.max(p,2)}%"></div></div>`;}).join('');
  document.getElementById('sparkA').textContent=st.from;
  document.getElementById('sparkB').textContent=st.to;

  /* カテゴリ別 */
  const cats=Object.entries(st.cat).map(([k,c])=>({k,c,r:c.rows?c.done/c.rows:0}))
    .sort((a,b)=>b.c.min-a.c.min);
  const el=document.getElementById('catBars');
  el.innerHTML=cats.length?cats.map(({k,c,r})=>{
    const col=catOf(k);const pct=Math.round(r*100);
    return `<div class="barrow${pct<50?' low':''}">
      <span class="nm">${col.e}${col.n}</span>
      <span class="tr"><span class="pl" style="background:${col.bar}"></span>
        <span class="dn" style="background:${col.bar};width:${pct}%"></span></span>
      <span class="pc">${pct}%</span></div>`;}).join('')
    :'<div class="empty">まだ集計できるデータがありません。</div>';

  /* 曜日別 */
  const wg=document.getElementById('wdGrid');
  const rs=st.wd.map(w=>w.rows?w.done/w.rows:null);
  const valid=rs.filter(v=>v!==null);
  const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
  wg.innerHTML=st.wd.map((w,i)=>{
    const r=rs[i];
    const cls=r===null?'':(r<avg-.12?'low':r>avg+.12?'hi':'');
    return `<div class="c ${cls}"><div class="d">${WKJ[i]}</div>
      <div class="p">${r===null?'–':Math.round(r*100)}</div></div>`;}).join('');

  /* 改善案 */
  document.getElementById('sugs').innerHTML=suggest(st).map(s=>
    `<div class="sug ${s.tone}"><span class="si">${s.i}</span>
      <span><span class="st">${esc(s.t)}</span><span class="sb">${esc(s.b)}</span></span></div>`).join('');
}

   見た目
   ============================================================ */
function syncLook(){
  const t=DB.prefs.theme||'auto';
  ['auto','light','dark'].forEach(k=>document.getElementById('th-'+k).classList.toggle('on',k===t));
  const mode=resolvedTheme();
  document.getElementById('swatches').innerHTML=Object.entries(ACCENTS).map(([k,a])=>{
    const c=a[mode];
    return `<button type="button" class="sw${k===DB.prefs.accent?' on':''}" onclick="pickAccent('${k}')"
      aria-pressed="${k===DB.prefs.accent}">
      <span class="dots"><span class="dot" style="background:${c.d}"></span>
        <span class="dot" style="background:${c.b}"></span>
        <span class="dot" style="background:${c.i}"></span></span>
      <span class="nm">${a.n}</span></button>`;}).join('');
}
function pickTheme(t){DB.prefs.theme=t;save();applyAppearance();syncLook();}
function pickAccent(k){DB.prefs.accent=k;save();applyAppearance();syncLook();toast('色を変えました');}

/* ============================================================
   台本
   ============================================================ */
const HOOKS=[
  d=>d.nth?`グアテマラ${d.nth}日目、${d.high}`:`${d.wk}曜のグアテマラ、${d.high}`,
  d=>`日本と15時間ズレた生活、${d.md}はこんな1日`,
  d=>d.nth?`スペイン語ゼロから${d.nth}日目の${d.wk}曜がこれ`:`スペイン語ゼロからの${d.wk}曜がこれ`,
  d=>`海外移住した日本人の、ふつうの${d.wk}曜`,
  d=>`朝${d.first}に始まって、夜は日本の仕事。${d.md}の全部`,
];
const CAPS=[
  d=>`${d.high}。\n\n${d.memo||'できた日もできない日も、とりあえず出す。'}\n\n現地${d.gtSpan}／日本時間だと${d.jpSpan}。${d.typeName}の日。`,
  d=>`${d.md}の記録。\n${d.bullets}\n\n${d.memo||'続けてると、できなかった日も記録になる。'}`,
  d=>`${d.memo||d.high}\n\nグアテマラは日本より15時間おそい。こっちの朝が、日本の夜。\n${d.typeName}。`,
];
const CAPS_ES=[
  d=>`Un ${d.wkEs} cualquiera en Guatemala.\n${d.highEs}\n\nJapón va 15 horas adelante — mi mañana es su noche.`,
  d=>`Así fue mi día: ${d.highEs}\n\nAprendiendo español desde cero, un día a la vez.`,
  d=>`Rutina de hoy en Guatemala 🇬🇹\n${d.highEs}\n\n¿Ustedes cómo empiezan el día?`,
];
const TAGS_BASE=['#グアテマラ','#海外移住','#スペイン語学習','#中南米','#移住生活','#Guatemala','#aprenderespañol','#vidaenguatemala'];
const TAGS_BY_CAT={
  study:['#語学学習','#スペイン語'],film:['#vlog','#撮影'],train:['#筋トレ','#朝活'],
  talk:['#会話練習','#アウトプット'],play:['#観光','#サルサ'],meal:['#自炊','#海外ごはん'],
  work:['#リモートワーク','#時差'],sns:['#発信'],self:['#振り返り'],ai:['#AI活用'],
};
let variant=0;
const WK_ES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hasJa=s=>/[぀-ヿ一-龯]/.test(s);
/* 「🎬 編集＋西語字幕 ／ Edición」から日本語側・スペイン語側をそれぞれ取り出す。
   先頭の絵文字は落とす（カット一覧では種類の絵文字を別に出すため）。 */
const clean=s=>String(s).split('／')[0].replace(/^[^\p{L}\p{N}]*/u,'').trim();
const cleanEs=s=>{
  const p=String(s).split('／');
  if(p[1])return p[1].replace(/^[^\p{L}\p{N}]*/u,'').trim();
  const c=clean(p[0]);
  return hasJa(c)?'':c;          /* 日本語しかない予定名はスペイン語文に混ぜない */
};
function scriptData(ds,memo,arrival){
  const type=dayType(ds), rows=timeline(type);
  const [y,mo,d]=ds.split('-').map(Number);
  /* その日らしい行だけ拾う（ごはん・フリー・就寝は絵にならないので後回し）。
     アポはお客さんの名前が入るので、公開する台本には出さない。 */
  const pri=['talk','play','film','study','train','sns','fix','ai','work'];
  const picked=[];
  (DB.events[ds]||[]).forEach(e=>picked.push({t:e.title,cat:e.cat||'free',g:e.gt}));
  pri.forEach(c=>rows.filter(r=>r.cat===c).forEach(r=>picked.push({t:r.t,cat:r.cat,g:r.g})));
  const uniq=[];const seen=new Set();
  picked.forEach(p=>{const key=p.cat+'@'+p.g;if(!seen.has(key)){seen.add(key);uniq.push(p);}});
  const cuts=uniq.slice(0,5)
    .map(p=>({...p,ct:clean(p.t),ce:cleanEs(p.t)}))
    .sort((a,b)=>a.g-b.g);
  const high=cuts.length?cuts[0].ct:'とくべつなことはない1日';
  const highEs=(cuts.find(c=>c.ce)||{}).ce||'un día normal por aquí';
  const first=rows.length?m2hm(rows[0].g):'6:00';
  const last=rows.length?m2hm(rows[rows.length-1].g):'23:00';
  const nth=arrival?daysBetween(arrival,ds)+1:0;
  return {
    ds,md:`${mo}/${d}`,wk:WKJ[dow(ds)],wkEs:WK_ES[dow(ds)],
    nth:nth>0?nth:0,
    typeName:DAYTYPE_NAME[type],high,highEs,
    first,gtSpan:`${first}〜${last}`,jpSpan:`${m2hm(gt2jp(rows.length?rows[0].g:360))}〜${m2hm(gt2jp(rows.length?rows[rows.length-1].g:1380))}`,
    memo:memo.trim(),cuts,
    bullets:cuts.map(c=>`・${m2hm(c.g)} ${c.ct}`).join('\n'),
  };
}
function genScript(next){
  if(next)variant++;
  const ds=document.getElementById('scDate').value||todayStr();
  const arr=document.getElementById('scArr').value;
  const memo=document.getElementById('scMemo').value;
  if(arr!==(DB.prefs.arrival||'')){DB.prefs.arrival=arr;save();}
  const d=scriptData(ds,memo,arr);
  const hook=HOOKS[variant%HOOKS.length](d);
  const cap=CAPS[variant%CAPS.length](d);
  const es=CAPS_ES[variant%CAPS_ES.length](d);
  const tags=[...new Set([...TAGS_BASE,...d.cuts.flatMap(c=>TAGS_BY_CAT[c.cat]||[])])].join(' ');
  const cutList=d.cuts.length
    ? d.cuts.map((c,i)=>
        `${i+1}. [${m2hm(c.g)} 現地 / JP ${m2hm(gt2jp(c.g))}] ${catOf(c.cat).e} ${c.ct}`).join('\n')
    : 'この日はまだ予定が入っていません。カレンダー側で予定を足すと、構成もそれに合わせて出ます。';
  const full=`【フック】${hook}\n\n【構成】\n${cutList}\n\n【キャプション】\n${cap}\n\n【スペイン語】\n${es}\n\n${tags}`;
  document.getElementById('scOut').innerHTML=`
    <div class="card">
      <h2>🎣 フック（最初の1秒）<span class="badge">${d.md} (${d.wk})</span></h2>
      <div class="out">${esc(hook)}</div>
      <div class="outlab">構成（${d.cuts.length}カット）</div>
      <div class="out">${esc(cutList)}</div>
    </div>
    <div class="card">
      <h2>✍️ キャプション</h2>
      <div class="outlab">日本語</div><div class="out">${esc(cap)}</div>
      <div class="outlab">ESPAÑOL</div><div class="out">${esc(es)}</div>
      <div class="outlab">ハッシュタグ</div><div class="out">${esc(tags)}</div>
      <div class="btnrow">
        <button class="btn primary" onclick='copyAll()'>📋 まとめてコピー</button>
        <button class="btn" onclick="genScript(true)">🔀 別の案</button>
      </div>
    </div>
    <div class="empty" style="text-align:left">
      文面はその日の時間割から組んだ下書きです。出す前に自分の言葉に直してください。
    </div>`;
  window.__full=full;
}
function copyAll(){
  const t=window.__full||'';
  const done=()=>toast('コピーしました');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  }else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(_){toast('コピーできませんでした');}
  document.body.removeChild(ta);
}

applyAppearance();
document.getElementById('scDate').value=todayStr();
if(DB.prefs.arrival)document.getElementById('scArr').value=DB.prefs.arrival;

addEventListener('storage',e=>{if(e.key===KEY){reloadDB();applyAppearance();renderAnalysis();syncLook();}});
